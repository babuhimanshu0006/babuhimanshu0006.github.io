<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PadhaiHub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033;padding-bottom:85px}
.header{background:linear-gradient(135deg,#1769d3,#1678e8);color:#fff;padding:25px 20px 35px;border-radius:0 0 35px 35px}
.container{max-width:700px;margin:auto;padding:18px}
.header h1{margin:5px 0;font-size:30px}
.card{background:#fff;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile,.subject{border:0;border-radius:16px;background:#f0f4ff;padding:20px;font-size:18px;font-weight:bold;cursor:pointer}
.tile{text-align:left}
.tile span{font-size:30px}
.subject{display:block;width:100%;margin:10px 0;text-align:left}
input,textarea{width:100%;padding:14px;border:2px solid #ddd;border-radius:12px;font-size:16px}
textarea{height:130px;resize:none}
.primary{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#1976d2;color:white;font-size:17px;font-weight:bold}
.secondary{width:100%;padding:13px;margin-top:10px;border:0;border-radius:12px;background:#eee;font-size:16px}
#study,#test,#plan,#profile,#ai,#quiz,#result{display:none}
.progress{height:10px;background:#ddd;border-radius:20px;overflow:hidden}
#homeBar,#bar{height:100%;width:0;background:#1976d2}
.option{width:100%;padding:14px;margin:7px 0;border:2px solid #ddd;background:#fff;border-radius:12px;text-align:left;font-size:16px}
.option.correct{background:#c9f7d5;border-color:#19a653}
.option.wrong{background:#ffd0d0;border-color:#e33}
.bottom{position:fixed;bottom:0;left:0;right:0;height:75px;background:#fff;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -3px 15px #0002;z-index:10}
.nav{border:0;background:none;color:#666;font-size:12px}.nav b{display:block;font-size:23px}
.center{text-align:center}.score{font-size:44px;font-weight:bold}
</style>
</head>

<body>

<div class="header">
<div class="container">
<h1>🎓 PadhaiHub</h1>
<p>Ek App, Saari Padhai 🚀</p>
<h2 id="greeting">Hi, Student 👋</h2>
</div>
</div>

<div class="container">

<section id="home">
<div class="card">
<h2>📊 Overall Progress</h2>
<p id="progressText">0% completed</p>
<div class="progress"><div id="homeBar"></div></div>
</div>

<div class="grid">
<button class="tile" onclick="showPage('study')">📚<br>Study</button>
<button class="tile" onclick="showPage('test')">📝<br>Test</button>
<button class="tile" onclick="showPage('plan')">⏰<br>Plan</button>
<button class="tile" onclick="showPage('profile')">👤<br>Profile</button>
<button class="tile" onclick="showPage('ai')">🤖<br>AI Doubt Solver</button>
</div>
</section>

<section id="study">
<div class="card">
<h2>📚 Study</h2>
<button class="subject" onclick="startQuiz('Biology')">🧬 Biology — 100 Questions</button>
<button class="subject" onclick="startQuiz('Physics')">⚡ Physics — 100 Questions</button>
<button class="subject" onclick="startQuiz('Chemistry')">🧪 Chemistry — 100 Questions</button>
</div>
</section>

<section id="test">
<div class="card">
<h2>📝 Mock Tests</h2>
<p>Total 300 MCQs.</p>
<button class="subject" onclick="startQuiz('Biology')">🧬 Biology Test</button>
<button class="subject" onclick="startQuiz('Physics')">⚡ Physics Test</button>
<button class="subject" onclick="startQuiz('Chemistry')">🧪 Chemistry Test</button>
</div>
</section>

<section id="plan">
<div class="card">
<h2>⏰ Study Planner</h2>
<input id="target" placeholder="Today's target">
<button class="primary" onclick="savePlan()">💾 Save Target</button>
<p id="planSaved"></p>
</div>
</section>

<section id="profile">
<div class="card">
<h2>👤 My Profile</h2>
<p>Apna naam enter karo:</p>
<input id="nameInput" placeholder="Enter your name">
<button class="primary" onclick="saveName()">💾 Save Profile</button>
<p id="savedMessage"></p>
</div>
</section>

<section id="ai">
<div class="card">
<h2>🤖 AI Doubt Solver</h2>
<p>Biology, Physics ya Chemistry ka doubt likho.</p>
<textarea id="aiQuestion" placeholder="Example: Newton's second law kya hai?"></textarea>
<button class="primary" onclick="askAI()">🤖 Ask AI</button>
<div id="aiAnswer" style="display:none;margin-top:15px;padding:15px;background:#f1f4fa;border-radius:12px"></div>
</div>
</section>

<section id="quiz">
<div class="card">
<div style="display:flex;justify-content:space-between">
<h2 id="subjectTitle"></h2><b id="counter"></b>
</div>
<div class="progress"><div id="bar"></div></div>
<h2 id="question"></h2>
<div id="options"></div>
<button class="primary" id="next" onclick="nextQuestion()" disabled>Next Question ➜</button>
</div>
</section>

<section id="result">
<div class="card center">
<h1>🎉 Quiz Complete!</h1>
<div class="score" id="score"></div>
<p id="resultText"></p>
<button class="primary" onclick="showPage('home')">🏠 Home</button>
<button class="secondary" onclick="showPage('test')">📝 Another Test</button>
</div>
</section>

</div>

<div class="bottom">
<button class="nav" onclick="showPage('home')"><b>🏠</b>Home</button>
<button class="nav" onclick="showPage('study')"><b>📚</b>Study</button>
<button class="nav" onclick="showPage('test')"><b>📝</b>Test</button>
<button class="nav" onclick="showPage('plan')"><b>⏰</b>Plan</button>
<button class="nav" onclick="showPage('profile')"><b>👤</b>Profile</button>
</div>

/* APP */

let questions=[],subject="",current=0,score=0,answered=false;

function showPage(page){
["home","study","test","plan","profile","ai","quiz","result"].forEach(x=>{
document.getElementById(x).style.display="none";
});
document.getElementById(page).style.display="block";
window.scrollTo(0,0);
}

function saveName(){
let n=document.getElementById("nameInput").value.trim();
if(!n){alert("Please enter your name");return}
localStorage.setItem("studentName",n);
document.getElementById("greeting").textContent="Hi, "+n+" 👋";
document.getElementById("savedMessage").textContent="✅ Profile saved!";
setTimeout(()=>showPage("home"),700);
}

function savePlan(){
let x=document.getElementById("target").value.trim();
if(!x){alert("Enter today's target");return}
localStorage.setItem("target",x);
document.getElementById("planSaved").textContent="✅ Target saved: "+x;
}

/* AI SCREEN */
function askAI(){
let q=document.getElementById("aiQuestion").value.trim();
let box=document.getElementById("aiAnswer");

if(!q){
alert("Pehle question likho 😊");
return;
}

box.style.display="block";
box.innerHTML=
"<b>🤖 AI Doubt Solver</b><br><br>"+
"Question: "+escapeHTML(q)+
"<br><br>"+
"AI connection abhi setup phase mein hai. "+
"Actual online AI answer ke liye secure API/backend connect karna hoga.";
}

function escapeHTML(text){
return text.replace(/[&<>"']/g,function(c){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
});
}

/* QUIZ */

function prepare(data){
return data.map(q=>{
let a=[
{text:q[1],correct:true},
{text:q[2],correct:false},
{text:q[3],correct:false},
{text:q[4],correct:false}
];
a.sort(()=>Math.random()-0.5);
return {question:q[0],answers:a};
});
}

function startQuiz(name){
subject=name;
if(name==="Biology")questions=prepare(biology);
if(name==="Physics")questions=prepare(physics);
if(name==="Chemistry")questions=prepare(chemistry);

current=0;
score=0;
answered=false;

showPage("quiz");

document.getElementById("subjectTitle").textContent=
name==="Biology"?"🧬 Biology":
name==="Physics"?"⚡ Physics":"🧪 Chemistry";

showQuestion();
}

function showQuestion(){
answered=false;
let q=questions[current];

document.getElementById("counter").textContent=
(current+1)+" / "+questions.length;

document.getElementById("bar").style.width=
(current/questions.length*100)+"%";

document.getElementById("question").textContent=q.question;

let box=document.getElementById("options");
box.innerHTML="";

q.answers.forEach((a,i)=>{
let b=document.createElement("button");
b.className="option";
b.textContent=String.fromCharCode(65+i)+". "+a.text;
b.onclick=()=>checkAnswer(i);
box.appendChild(b);
});

document.getElementById("next").disabled=true;
document.getElementById("next").textContent=
current===questions.length-1?"Finish Quiz ✓":"Next Question ➜";
}

function checkAnswer(i){
if(answered)return;
answered=true;

let q=questions[current];
let buttons=document.querySelectorAll(".option");

buttons.forEach((b,x)=>{
b.disabled=true;
if(q.answers[x].correct)b.classList.add("correct");
});

if(q.answers[i].correct)score++;
else buttons[i].classList.add("wrong");

document.getElementById("next").disabled=false;
}

function nextQuestion(){
if(!answered)return;
current++;

if(current>=questions.length){
finishQuiz();
return;
}
showQuestion();
}

function finishQuiz(){
let percent=Math.round(score/questions.length*100);

showPage("result");

document.getElementById("score").textContent=
score+" / "+questions.length;

let msg=percent>=90?
"🏆 Excellent!":
percent>=75?
"👏 Great job!":
percent>=50?
"👍 Good attempt!":
"💪 Keep practicing!";

document.getElementById("resultText").textContent=
subject+" • "+percent+"% • "+msg;

localStorage.setItem("lastScore",percent);

document.getElementById("homeBar").style.width=percent+"%";
document.getElementById("progressText").textContent=
percent+"% completed";
}

/* LOAD SAVED DATA */

let savedName=localStorage.getItem("studentName");
if(savedName){
document.getElementById("greeting").textContent=
"Hi, "+savedName+" 👋";
document.getElementById("nameInput").value=savedName;
}

let savedTarget=localStorage.getItem("target");
if(savedTarget){
document.getElementById("target").value=savedTarget;
document.getElementById("planSaved").textContent=
"📌 Saved target: "+savedTarget;
}

let savedScore=localStorage.getItem("lastScore");
if(savedScore){
document.getElementById("homeBar").style.width=savedScore+"%";
document.getElementById("progressText").textContent=
savedScore+"% completed";
}

</script>
