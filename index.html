<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Science Quiz - 300 MCQs</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;
  color:#222;
}
.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  border-radius:22px;
  padding:22px;
  margin-top:20px;
  box-shadow:0 10px 30px #0003;
}
h1{text-align:center;margin:5px 0 10px}
h2{margin-top:0}
.subtitle{text-align:center;color:#666}
.subjects{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
  margin-top:25px;
}
.subject{
  border:0;
  border-radius:16px;
  padding:20px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  background:#f1f3ff;
}
.subject:hover{transform:scale(1.02)}
.bio{border-left:7px solid #20a464}
.physics{border-left:7px solid #3976ff}
.chem{border-left:7px solid #ff6b35}
button{
  font-family:inherit;
}
#quiz{display:none}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.progress{
  height:10px;
  background:#ddd;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0;
}
#bar{
  height:100%;
  width:0%;
  background:#667eea;
  transition:.3s;
}
.option{
  display:block;
  width:100%;
  text-align:left;
  border:2px solid #ddd;
  background:white;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
.option:hover{background:#f3f4ff}
.option.correct{background:#c8f7d5;border-color:#19a653}
.option.wrong{background:#ffd0d0;border-color:#e33}
.option:disabled{cursor:default}
#next,#restart{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#667eea;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}
#next:disabled{opacity:.5}
#result{
  display:none;
  text-align:center;
}
.score{
  font-size:42px;
  font-weight:bold;
  margin:20px;
}
.small{
  color:#777;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="card" id="home">
  <h1>🧠 Science Quiz</h1>
  <p class="subtitle">300 MCQs • Biology • Physics • Chemistry</p>

  <div class="subjects">
    <button class="subject bio" onclick="startQuiz('Biology')">
      🧬 Biology<br>
      <span class="small">100 Questions</span>
    </button>

    <button class="subject physics" onclick="startQuiz('Physics')">
      ⚡ Physics<br>
      <span class="small">100 Questions</span>
    </button>

    <button class="subject chem" onclick="startQuiz('Chemistry')">
      🧪 Chemistry<br>
      <span class="small">100 Questions</span>
    </button>
  </div>
</div>

<div class="card" id="quiz">

  <div class="top">
    <h2 id="subjectTitle"></h2>
    <b id="counter"></b>
  </div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <h2 id="question"></h2>

  <div id="options"></div>

  <button id="next" onclick="nextQuestion()" disabled>
    Next Question ➜
  </button>

</div>

<div class="card" id="result">
  <h1>🎉 Quiz Complete!</h1>
  <div class="score" id="score"></div>
  <p id="resultText"></p>

  <button id="restart" onclick="goHome()">
    🔄 Choose Another Subject
  </button>
</div>

</div>

/* =========================
   QUIZ ENGINE
========================= */

let currentSubject="";
let questions=[];
let current=0;
let score=0;
let answered=false;

function startQuiz(subject){

  currentSubject=subject;

  if(subject==="Biology") questions=biology;
  if(subject==="Physics") questions=physics;
  if(subject==="Chemistry") questions=chemistry;

  current=0;
  score=0;
  answered=false;

  document.getElementById("home").style.display="none";
  document.getElementById("result").style.display="none";
  document.getElementById("quiz").style.display="block";

  document.getElementById("subjectTitle").textContent=
    subject==="Biology"?"🧬 Biology":
    subject==="Physics"?"⚡ Physics":"🧪 Chemistry";

  showQuestion();
}

function showQuestion(){

  answered=false;

  const q=questions[current];

  document.getElementById("counter").textContent=
    (current+1)+" / "+questions.length;

  document.getElementById("question").textContent=q[0];

  document.getElementById("bar").style.width=
    ((current)/questions.length*100)+"%";

  const box=document.getElementById("options");
  box.innerHTML="";

  q[1].forEach((answer,index)=>{

    const btn=document.createElement("button");

    btn.className="option";
    btn.textContent=
      String.fromCharCode(65+index)+". "+answer;

    btn.onclick=()=>checkAnswer(index,btn);

    box.appendChild(btn);
  });

  document.getElementById("next").disabled=true;

  if(current===questions.length-1){
    document.getElementById("next").textContent="Finish Quiz ✓";
  }else{
    document.getElementById("next").textContent="Next Question ➜";
  }
}

function checkAnswer(selected,button){

  if(answered)return;

  answered=true;

  const correct=questions[current][2];
  const all=document.querySelectorAll(".option");

  all.forEach((btn,i)=>{
    btn.disabled=true;

    if(i===correct){
      btn.classList.add("correct");
    }
  });

  if(selected===correct){
    score++;
  }else{
    button.classList.add("wrong");
  }

  document.getElementById("next").disabled=false;
}

function nextQuestion(){

  if(!answered)return;

  current++;

  if(current>=questions.length){
    finishQuiz();
    return;
  }

  showQuestion();
}

function finishQuiz(){

  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";

  document.getElementById("score").textContent=
    score+" / "+questions.length;

  let percentage=Math.round(score/questions.length*100);

  let message="";

  if(percentage>=90){
    message="🏆 Excellent! Science champion!";
  }else if(percentage>=75){
    message="👏 Great job! Keep practicing!";
  }else if(percentage>=50){
    message="👍 Good attempt! You can improve!";
  }else{
    message="💪 Keep studying and try again!";
  }

  document.getElementById("resultText").textContent=
    currentSubject+" • "+percentage+"% • "+message;

  localStorage.setItem(
    "lastQuiz",
    JSON.stringify({
      subject:currentSubject,
      score:score,
      total:questions.length
    })
  );
}

function goHome(){

  document.getElementById("result").style.display="none";
  document.getElementById("quiz").style.display="none";
  document.getElementById("home").style.display="block";
}
