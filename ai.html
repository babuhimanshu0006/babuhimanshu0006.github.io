<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Doubt Solver</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f6ff;
  margin:0;
  padding:20px;
}
.box{
  max-width:600px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 20px #ddd;
}
h1{color:#222;}
input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}
textarea{height:130px;}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#4169e1;
  color:white;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}
#answer{
  margin-top:20px;
  padding:15px;
  background:#f5f5f5;
  border-radius:12px;
  white-space:pre-wrap;
}
.small{
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">
<h1>🤖 AI Doubt Solver</h1>

<p class="small">
Apni Gemini API key yahan paste karo. Key is page mein save nahi hogi.
</p>

<input id="apiKey" type="password" placeholder="Gemini API Key">

<textarea id="question"
placeholder="Apna Biology, Physics ya Chemistry ka doubt likho..."></textarea>

<button onclick="askAI()">Ask AI 🤖</button>

<div id="answer">AI ka answer yahan aayega...</div>
</div>

<script>
async function askAI(){

  const apiKey = document.getElementById("apiKey").value.trim();
  const question = document.getElementById("question").value.trim();
  const answer = document.getElementById("answer");

  if(!apiKey){
    answer.textContent = "❌ Pehle Gemini API key paste karo.";
    return;
  }

  if(!question){
    answer.textContent = "❌ Pehle question likho.";
    return;
  }

  answer.textContent = "🤖 AI soch raha hai...";

  try{

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-goog-api-key":apiKey
        },
        body:JSON.stringify({
          contents:[
            {
              parts:[
                {
                  text:
                  "You are a helpful school science doubt solver. " +
                  "Answer clearly in simple Hindi/Hinglish. " +
                  "Question: " + question
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error?.message || "API error");
    }

    const text =
      data.candidates?.[0]?.content?.parts?.[0]?.text;

    answer.textContent =
      text || "❌ AI ne koi answer nahi diya.";

  }catch(error){

    answer.textContent =
      "❌ Error: " + error.message;

  }
}
</script>

</body>
</html>
